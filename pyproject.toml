[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-pro-data-platform"
version = "0.1.0"
description = "Real-time HR data platform built for the Data Engineering educational project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.15,<3",
  "pymongo>=4.17.0",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.2,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=hr_pro_platform --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["hr_pro_platform"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

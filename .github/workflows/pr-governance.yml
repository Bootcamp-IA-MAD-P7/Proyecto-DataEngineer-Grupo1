name: PR governance

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    name: Validate Jira key and conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.trim();
            const required = /^HRP-\d+\s+(feat|fix|docs|test|refactor|chore|ci):\s+.+$/;
            if (!required.test(title)) {
              core.setFailed(
                "El título debe tener el formato 'HRP-XX tipo: resumen'. " +
                "Ejemplo: 'HRP-30 feat: add Kafka consumer'."
              );
            }

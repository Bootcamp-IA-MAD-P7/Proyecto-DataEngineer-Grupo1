name: quality

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # HRP-70: ephemeral, CI-only service container -- ports are published only
    # to this job's own runner (never exposed publicly). The password below
    # is not a secret: it is a plain, visible job-environment value (as any
    # GitHub Actions log reader could see), scoped to this throwaway
    # container only, distinct from infra/compose.dev.yml's development
    # password, and discarded when the job ends.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hr_pro
          POSTGRES_PASSWORD: hr-pro-ci-ephemeral
          POSTGRES_DB: hr_pro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_pro -d hr_pro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: hr_pro
      POSTGRES_USER: hr_pro
      POSTGRES_PASSWORD: hr-pro-ci-ephemeral
      MONGODB_URI: mongodb://localhost:27017/hr_pro
      MONGODB_DB: hr_pro
      MONGODB_COLLECTION: raw_events
      MONGODB_INVALID_COLLECTION: invalid_events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_specs.py
      - run: pre-commit run --all-files
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - name: Validate development Compose
        run: docker compose -f infra/compose.dev.yml config --quiet

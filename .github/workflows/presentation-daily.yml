name: Generate presentation daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha YYYY-MM-DD; se usa la fecha actual si se deja vacía"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Generate daily source
        shell: pwsh
        env:
          DAILY_DATE: ${{ inputs.date }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DAILY_DATE)) {
            ./scripts/new-presentation-daily.ps1
          } else {
            ./scripts/new-presentation-daily.ps1 -Date $env:DAILY_DATE
          }

      - name: Open reviewable pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/presentation-daily
          delete-branch: true
          commit-message: "docs: generate presentation daily"
          title: "HRP-22 docs: generate presentation daily"
          body: |
            ## Context and traceability

            - **Jira:** HRP-22
            - **Source:** `scripts/new-presentation-daily.ps1`
            - **Purpose:** generated daily source for the project presentation

            ## Review requirements

            - [ ] The daily contains only verifiable project facts.
            - [ ] No secret, PII, raw Kafka payload or generator information is included.
            - [ ] A human reviewer has checked the generated changes.

            This workflow intentionally opens a pull request instead of pushing directly
            to `develop`.

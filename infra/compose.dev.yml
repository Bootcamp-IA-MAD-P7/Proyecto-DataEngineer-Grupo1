services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hr-pro-data-platform:dev
    container_name: hr-pro-app-dev
    profiles:
      - app
    restart: unless-stopped
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/hr_pro
      INGESTION_METRICS_HOST: 0.0.0.0
      INGESTION_METRICS_PORT: 9464
    expose:
      - "9464"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  etl:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hr-pro-data-platform:dev
    container_name: hr-pro-etl-dev
    profiles:
      - app
    restart: unless-stopped
    command: ["python", "-m", "hr_pro_platform.transformation.main"]
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/hr_pro
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      HRP_ETL_BATCH_SIZE: 250
      HRP_ETL_POLL_SECONDS: 1
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hr-pro-data-platform:dev
    container_name: hr-pro-api-dev
    profiles:
      - app
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - hr_pro_platform.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: hr-pro-mongo-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: hr-pro-postgres-dev
    restart: unless-stopped
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2
    container_name: hr-pro-redis-dev
    restart: unless-stopped
    volumes:
      - type: tmpfs
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hr-pro-prometheus-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=0.0.0.0:9090"

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: hr-pro-grafana-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mongo_data:
  postgres_data:

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: hr-pro-data-platform:dev
    container_name: hr-pro-app-dev
    profiles:
      - app
    restart: unless-stopped
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/hr_pro
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: hr-pro-mongo-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: hr-pro-postgres-dev
    restart: unless-stopped
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  postgres_data:
